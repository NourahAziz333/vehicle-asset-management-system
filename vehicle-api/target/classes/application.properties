
// tells Spring Boot how to connect to the H2 database, which port to run on, and how to configure JPA.

# Server port
server.port=8080

# H2 Embedded Database
spring.datasource.url=jdbc:h2:mem:vehicledb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (open in browser at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL init
spring.sql.init.mode=always